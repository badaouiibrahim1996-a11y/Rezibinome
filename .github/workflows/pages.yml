name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - rezibinome-dz.zip
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unzip project
        run: unzip -q rezibinome-dz.zip -d work
      - name: Install
        working-directory: work/rezibinome-dz
        run: npm install
      - name: Typecheck (résultat visible, ne bloque pas le déploiement)
        working-directory: work/rezibinome-dz
        continue-on-error: true
        run: npm run typecheck
      - name: Build
        working-directory: work/rezibinome-dz
        env:
          VITE_SUPABASE_URL: https://vfpsgfhfkzbxlrgzrxhz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_IG2301SU6M6DJXrBtzygWw_k1e64TQR
        run: |
          npm run build -- --base=/${{ github.event.repository.name }}/
          cp dist/public/index.html dist/public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/rezibinome-dz/dist/public
      - id: deployment
        uses: actions/deploy-pages@v4
